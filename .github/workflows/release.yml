# Publishes a tagged Slime release.
#
# The previous version of this workflow was generated by NeoForge's GradleUtils and was gated on
# `github.repository == 'neoforged/NeoForge'`, so it could never run in this fork. This is the
# Slime-native replacement.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup
        run: ./gradlew setup

      - name: Build server jar
        run: ./gradlew slimeJar

      - name: Publish release
        uses: ncipollo/release-action@v1.12.0
        with:
          allowUpdates: true
          makeLatest: true
          removeArtifacts: true
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          artifacts: ./projects/slime/build/libs/slime-*-server.jar
          token: ${{ secrets.GITHUB_TOKEN }}
