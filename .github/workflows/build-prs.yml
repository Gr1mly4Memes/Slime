# Build PRs
#
# Slime-specific: this replaces the GradleUtils-generated workflow. Two of its steps could never
# succeed in this repo:
#   * `checkFormatting` - the `neoforge.formatting-conventions` plugin is present in buildSrc but
#     is not applied to any project, so the task does not exist. (Applying it is not a quick win
#     either: it forbids @NotNull/@Nonnull and wildcard imports, which ~880 bundled
#     Bukkit/Paper/PurPur files use.)
#   * `checkJarCompatibility` - compares this jar against net.neoforged:neoforge published on
#     Maven, i.e. upstream NeoForge rather than the previous Slime release.

name: Build PRs

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup with Gradle
        run: ./gradlew setup

      # Build the actual deliverable. `assemble` alone never produced the runnable server jar.
      - name: Build with Gradle
        run: ./gradlew slimeJar

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: slime-server
          path: ./projects/slime/build/libs/slime-*-server.jar
