# Builds the Slime server jar and, on the release branch, publishes it to GitHub Releases.

name: Build

on:
  push:
    branches:
      - '26.*'
  pull_request:
  workflow_dispatch:

env:
  MINECRAFT_VERSION: 26.2
  VERSION: 26.2
  RELEASE_NAME: slime-26.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup
        run: ./gradlew setup

      - name: Build with Gradle
        run: ./gradlew slimeJar

      # Only publish the runnable server jar. The previous glob also uploaded the universal jar,
      # the installer and the userdev bundle, which made the release page ambiguous to download.
      - name: Upload Slime server jar
        uses: actions/upload-artifact@v4
        with:
          name: Slime
          path: ./projects/slime/build/libs/slime-*-server.jar

      # Never run on pull requests: creating/updating a public release from a PR build publishes
      # unreviewed code and can leak artefacts from forks.
      - name: Set version env
        if: github.event_name != 'pull_request'
        run: echo "RELEASE_VERSION=${GITHUB_REF:10}" >> $GITHUB_ENV

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1.12.0
        with:
          allowUpdates: true
          makeLatest: true
          removeArtifacts: true
          tag: "26.2-release"
          artifacts: ./projects/slime/build/libs/slime-*-server.jar
          token: ${{ secrets.GITHUB_TOKEN }}
